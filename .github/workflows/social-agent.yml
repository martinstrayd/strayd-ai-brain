name: Strayd Social Agent

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-content:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Social Content
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          curl -s https://inference.dahl.global/v1/chat/completions \
          -H "Authorization: Bearer $DAHL_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "model":"MiniMaxAI/MiniMax-M2.7",
            "messages":[
              {
                "role":"system",
                "content":"You are Martin Strayd Social Manager. Never invent artists. Never create fake bands. Use only Martin Strayd, Fantasy7, Suzuki & Strayd, Strayd.com and real information provided. Output markdown only. No reasoning. No thinking process. No explanations."
              },
              {
                "role":"user",
                "content":"Create 10 X posts, 3 Facebook posts, 1 YouTube Community post and 5 image prompts for Martin Strayd."
              }
            ]
          }'
