name: Strayd Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-content-director-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check configuration
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          test -s brand-profile.md || {
            echo "::error::brand-profile.md is missing or empty."
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY secret is missing."
            exit 1
          }

          command -v jq >/dev/null
          command -v python3 >/dev/null
          command -v curl >/dev/null

          echo "Configuration checks passed."

      - name: Read Brand Profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'PROFILE<<STRAYD_PROFILE_EOF'
            cat brand-profile.md
            echo
            echo 'STRAYD_PROFILE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Weekly Content Calendar
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PROFILE: ${{ steps.profile.outputs.PROFILE }}
        run: |
          set -euo pipefail

          PROMPT="$(cat <<'PROMPT_EOF'
          Create a complete, publishable STRAYD social content calendar
          for seven days, Monday through Sunday.

          BRAND ACCURACY:
          - Treat the supplied brand profile as the source of truth.
          - Never invent songs, releases, lyrics, biography, achievements,
            release dates, streaming links, or other factual claims.
          - Do not invent URLs. Use https://strayd.com when appropriate
            and use other links only if confirmed in the profile.
          - Keep the content relevant to STRAYD and its actual identity.
          - Make each day's content original and distinct.

          REQUIRED FORMAT:
          Use exactly these seven main headings, once each:
          ## Monday
          ## Tuesday
          ## Wednesday
          ## Thursday
          ## Friday
          ## Saturday
          ## Sunday

          Under EVERY day, use these exact platform labels as headings:

          ### X
          Write one concise, ready-to-publish post.

          ### Facebook
          Write one complete, conversational post.

          ### YouTube Community
          Write a complete community post, question, or poll.
          Include the actual wording that can be published.

          ### TikTok
          Include:
          - Video concept and visual action.
          - A strong hook for the first 1-3 seconds.
          - On-screen text in sequence.
          - A complete caption.
          - Relevant hashtags.
          - Suggested sound or music direction.
          - A clear call to action.

          ### Instagram
          Choose Reel, carousel, or single-image post.
          Include:
          - Format and visual concept.
          - Complete, publishable caption.
          - Relevant hashtags.
          - For Reels, the opening hook and on-screen text.
          - For carousels, the text for every slide.
          - A clear call to action.

          ### Image Prompt
          Write a detailed prompt for creating that day's artwork.
          Keep the visual direction specific and suitable for social media.

          ### Short Video Idea
          Give a practical concept, first shot, sequence, and ending.

          WEEKLY THEME ROTATION:
          Rotate these themes naturally across the seven days:
          - Weekly Song Journey
          - Fantasy7
          - Creativity After 50
          - Independent Music
          - NATRON THEORY
          - How To Rock
          - Cool Hot Sauce
          - Creative Persistence

          QUALITY RULES:
          - Every day must include all five platforms: X, Facebook,
            YouTube Community, TikTok, and Instagram.
          - Image Prompt and Short Video Idea must also appear every day.
          - Do not replace publishable content with generic advice.
          - Avoid repeating the same post across platforms.
          - Make TikTok and Instagram content fully usable, not just
            a suggestion to create a video or image.
          - Use clear Markdown, bold labels, short paragraphs, and bullets.
          - Return Markdown only. No introduction and no code fences.

          Before returning your answer, check that all seven days are
          present and that every day contains every required section.
          PROMPT_EOF
          )"

          jq -n \
            --arg profile "$PROFILE" \
            --arg instructions "$PROMPT" \
            '{
              model: "MiniMaxAI/MiniMax-M2.7",
              messages: [
                {
                  role: "system",
                  content: "You are the STRAYD Content Director. Follow the supplied brand profile accurately. Return complete, publishable Markdown. Never invent factual claims. Follow the requested headings exactly."
                },
                {
                  role: "user",
                  content: (
                    "BRAND PROFILE:\n\n" +
                    $profile +
                    "\n\nCONTENT REQUIREMENTS:\n\n" +
                    $instructions
                  )
                }
              ]
            }' > request.json

          echo "Sending content request to Dahl API..."

          HTTP_CODE="$(
            curl --silent --show-error \
              --max-time 240 \
              --output response.json \
              --write-out "%{http_code}" \
              --request POST \
              "https://inference.dahl.global/v1/chat/completions" \
              --header "Authorization: Bearer ${DAHL_API_KEY}" \
              --header "Content-Type: application/json" \
              --data-binary @request.json
          )"

          if [[ ! "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dahl API returned HTTP ${HTTP_CODE}."
            jq -r '.error.message // .message // "No error details returned."' \
              response.json 2>/dev/null || true
            exit 1
          fi

          jq -er '
            .choices[0].message.content
            | strings
            | select(length > 100)
          ' response.json > generated-calendar.md || {
            echo "::error::Dahl API returned no usable calendar content."
            jq -r '.error.message // .message // .' response.json || true
            exit 1
          }

          echo "Calendar response received."
          echo "Checking required sections..."

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("generated-calendar.md").read_text(
              encoding="utf-8"
          ).strip()

          days = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          # Accept a day heading with optional trailing date or description,
          # while still requiring a Markdown level-two heading.
          day_pattern = re.compile(
              r"^##\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b.*$",
              re.IGNORECASE | re.MULTILINE
          )

          matches = list(day_pattern.finditer(text))
          found = [m.group(1).capitalize() for m in matches]

          missing = [day for day in days if day not in found]
          duplicates = sorted({
              day for day in found if found.count(day) > 1
          })

          if missing:
              print(
                  "::error::Calendar is missing days: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          if duplicates:
              print(
                  "::error::Calendar has duplicate day headings: "
                  + ", ".join(duplicates)
              )
              sys.exit(1)

          required_sections = [
              "X",
              "Facebook",
              "YouTube Community",
              "TikTok",
              "Instagram",
              "Image Prompt",
              "Short Video Idea",
          ]

          for index, match in enumerate(matches):
              day = match.group(1).capitalize()
              end = (
                  matches[index + 1].start()
                  if index + 1 < len(matches)
                  else len(text)
              )
              section = text[match.start():end]

              for label in required_sections:
                  heading = re.compile(
                      r"^#{1,6}\s+" + re.escape(label) + r"\s*$",
                      re.IGNORECASE | re.MULTILINE
                  )
                  if not heading.search(section):
                      print(
                          f"::error::{day} is missing the "
                          f"'{label}' heading."
                      )
                      sys.exit(1)

          Path("generated-calendar.md").write_text(
              text + "\n", encoding="utf-8"
          )

          print("Validation passed: seven days and all required sections.")
          PY

      - name: Create Weekly and Daily Markdown Files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          import sys

          source = Path("generated-calendar.md")
          text = source.read_text(encoding="utf-8").strip()

          weekly_dir = Path("social-posts/weekly")
          daily_dir = Path("social-posts/daily")

          weekly_dir.mkdir(parents=True, exist_ok=True)
          daily_dir.mkdir(parents=True, exist_ok=True)

          today = datetime.now(timezone.utc).date().isoformat()

          days = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          day_pattern = re.compile(
              r"^##\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\b.*$",
              re.IGNORECASE | re.MULTILINE
          )

          matches = list(day_pattern.finditer(text))
          sections = {}

          for index, match in enumerate(matches):
              day = match.group(1).capitalize()
              end = (
                  matches[index + 1].start()
                  if index + 1 < len(matches)
                  else len(text)
              )
              sections[day] = text[match.start():end].strip()

          missing = [day for day in days if day not in sections]
          if missing:
              print(
                  "::error::Cannot create files; missing: "
                  + ", ".join(missing)
              )
              sys.exit(1)

          # Save the full weekly calendar.
          weekly_file = weekly_dir / f"{today}-calendar.md"
          weekly_file.write_text(text + "\n", encoding="utf-8")

          # Save one separate Markdown file for every day.
          for day in days:
              output = daily_dir / f"{today}-{day.lower()}.md"

              content = (
                  f"# STRAYD Daily Social Content — {day}\n\n"
                  f"Generated: {today} (UTC)\n\n"
                  f"{sections[day]}\n"
              )

              output.write_text(content, encoding="utf-8")
              print(f"Created {output}")

          print(f"Created {weekly_file}")
          PY

      - name: Commit generated files
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/weekly/ social-posts/daily/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD daily and weekly social content"

          git push origin "HEAD:${TARGET_BRANCH}"

          echo "SUCCESS: Weekly and daily content committed."
