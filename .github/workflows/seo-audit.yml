
name: STRAYD SEO Manager Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strayd-seo-audit
  cancel-in-progress: false

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DAHL_API_KEY:-}" ]; then
            echo "::error::DAHL_API_KEY secret is missing."
            exit 1
          fi

          for file in \
            agents/seo-manager.agent.md \
            brand-profile.md \
            songarchive.md \
            martinstrayd.md \
            suzukimusic.md
          do
            if [ ! -f "$file" ]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
          done

          mkdir -p reports
          echo "All required SEO audit source files are present."

      - name: Prepare audit instructions
        run: |
          set -euo pipefail

          {
            cat agents/seo-manager.agent.md

            printf '\n\n## AUDIT REQUIREMENTS\n'
            printf '%s\n' \
              'Audit the STRAYD music brand and its supplied knowledge files.' \
              'Use only evidence in the supplied source material.' \
              'Do not claim to have checked live search rankings, analytics, backlinks, or webpages unless the source material proves this.' \
              'Clearly separate confirmed facts, risks, and recommendations.' \
              'Be specific and practical. Prioritise improvements by impact.' \
              'Use the exact Markdown headings listed below.' \
              'Do not omit a heading. If information is unavailable, state that clearly under the relevant heading.' \
              '' \
              '# STRAYD SEO AUDIT' \
              '## Executive Summary' \
              '## Current Strengths' \
              '## SEO Problems and Risks' \
              '## Recommended Improvements' \
              '## Content and Keyword Opportunities' \
              '## Priority Action Plan' \
              '## Missing Information and Limitations' \
              '' \
              'Finish the entire report with this exact final line:' \
              'AUDIT COMPLETE'

            printf '\n\n## SEO MANAGER INSTRUCTIONS\n'
            cat agents/seo-manager.agent.md

            printf '\n\n## BRAND PROFILE\n'
            cat brand-profile.md

            printf '\n\n## SONG ARCHIVE\n'
            cat songarchive.md

            printf '\n\n## MARTIN STRAYD PROFILE\n'
            cat martinstrayd.md

            printf '\n\n## SUZUKI PROFILE\n'
            cat suzukimusic.md
          } > seo-audit-source.md

          echo "SEO audit source material prepared."
          echo "Source size: $(wc -c < seo-audit-source.md) bytes."

      - name: Run SEO audit with retry and repair
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          API_URL="https://inference.dahl.global/v1/chat/completions"
          MODEL="MiniMaxAI/MiniMax-M2.7"

          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("seo-audit-source.md").read_text(encoding="utf-8")

          payload = {
              "model": "MiniMaxAI/MiniMax-M2.7",
              "messages": [
                  {
                      "role": "user",
                      "content": source
                  }
              ],
              "temperature": 0.2,
              "max_tokens": 12000
          }

          Path("seo-audit-request.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

          call_dahl() {
            local input_file="$1"
            local output_file="$2"
            local attempt=1
            local max_attempts=3

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "DAHL request attempt ${attempt}/${max_attempts}..."

              if curl \
                --silent \
                --show-error \
                --fail-with-body \
                --connect-timeout 30 \
                --max-time 300 \
                --request POST "$API_URL" \
                --header "Authorization: Bearer ${DAHL_API_KEY}" \
                --header "Content-Type: application/json" \
                --data-binary "@${input_file}" \
                --output "${output_file}.json"
              then
                if python3 - "$output_file.json" "$output_file" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])

          try:
              data = json.loads(response_path.read_text(encoding="utf-8"))
              content = data["choices"][0]["message"]["content"]
              if not isinstance(content, str) or not content.strip():
                  raise ValueError("Empty response content")
              output_path.write_text(content.strip() + "\n", encoding="utf-8")
          except Exception as exc:
              print(f"Invalid DAHL response: {exc}")
              sys.exit(1)
          PY
                then
                  return 0
                fi
              fi

              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((attempt * 10))
              fi

              attempt=$((attempt + 1))
            done

            return 1
          }

          if ! call_dahl seo-audit-request.json seo-audit-report.md; then
            echo "::error::DAHL failed to return a usable report after three attempts."
            exit 1
          fi

          validate_report() {
            python3 - "$1" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8").strip()
          required = [
              "# STRAYD SEO AUDIT",
              "## Executive Summary",
              "## Current Strengths",
              "## SEO Problems and Risks",
              "## Recommended Improvements",
              "## Content and Keyword Opportunities",
              "## Priority Action Plan",
              "## Missing Information and Limitations",
          ]

          missing = [heading for heading in required if heading not in text]
          if missing:
              for heading in missing:
                  print(f"Missing section: {heading}")
              sys.exit(1)

          if text.splitlines()[-1].strip() != "AUDIT COMPLETE":
              print("Report does not end with AUDIT COMPLETE.")
              sys.exit(1)

          if len(text) < 1500:
              print("Report is unexpectedly short.")
              sys.exit(1)

          print("Report completeness checks passed.")
          PY
          }

          if ! validate_report seo-audit-report.md; then
            echo "First report failed validation. Asking DAHL to repair it."

            python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("seo-audit-report.md").read_text(encoding="utf-8")
          repair_prompt = """Repair the SEO audit below.

          Return the COMPLETE report, not a summary and not an explanation of changes.
          Preserve useful analysis, fill every required section, and do not invent evidence.
          Use these exact headings:
          # STRAYD SEO AUDIT
          ## Executive Summary
          ## Current Strengths
          ## SEO Problems and Risks
          ## Recommended Improvements
          ## Content and Keyword Opportunities
          ## Priority Action Plan
          ## Missing Information and Limitations

          The final nonblank line must be exactly:
          AUDIT COMPLETE

          If a fact cannot be verified from the supplied material, say so.
          
          REPORT TO REPAIR:
          """ + report

          payload = {
              "model": "MiniMaxAI/MiniMax-M2.7",
              "messages": [{"role": "user", "content": repair_prompt}],
              "temperature": 0.1,
              "max_tokens": 12000
          }

          Path("seo-audit-repair-request.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8"
          )
          PY

            if ! call_dahl seo-audit-repair-request.json seo-audit-repaired.md; then
              echo "::error::DAHL could not repair the incomplete report."
              exit 1
            fi

            if ! validate_report seo-audit-repaired.md; then
              echo "::error::The repaired report still failed completeness checks."
              exit 1
            fi

            mv seo-audit-repaired.md seo-audit-report.md
          fi

          echo "SEO audit report is complete."

      - name: Save audit report
        run: |
          set -euo pipefail

          REPORT_DATE="$(date -u +%F)"
          REPORT_PATH="reports/seo-audit-${REPORT_DATE}.md"

          cp seo-audit-report.md "$REPORT_PATH"

          {
            echo ""
            echo "---"
            echo ""
            echo "Audit generated: ${REPORT_DATE} (UTC)"
          } >> "$REPORT_PATH"

          # Keep the completion marker as the final nonblank line.
          python3 - "$REPORT_PATH" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()
          lines = [line for line in lines if line.strip() != "AUDIT COMPLETE"]
          while lines and not lines[-1].strip():
              lines.pop()
          lines.append("")
          lines.append("AUDIT COMPLETE")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          echo "Report saved to ${REPORT_PATH}."

      - name: Commit audit report
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add STRAYD SEO audit report"
            git push
          fi
