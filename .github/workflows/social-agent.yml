---

# REQUIRED IMAGE STYLE

Always favour:

- Photorealistic
- Documentary photography
- Editorial photography
- Music magazine photography
- Studio photography
- Concert photography
- Real-world environments

---

# PROHIBITED IMAGE STYLES

Avoid:

- Anime
- Cartoon
- Illustration
- Fantasy
- Cyberpunk
- Science fiction
- CGI
- Plastic skin
- Unrealistic anatomy

The objective is realistic human photography.

---

# SHORT VIDEO IDEAS

Every day must include:

- First shot
- Story progression
- Ending shot

Content should be achievable using:

- Existing footage
- Smartphones
- Archive material
- Simple filming
- Existing artwork

Avoid requiring expensive production.

---

# FACT CHECKING RULES

Never invent:

- Songs
- Albums
- Releases
- Tour dates
- Awards
- Statistics
- Business achievements
- Streaming links
- Lyrics
- Historical events

If information is not present in the knowledge base:

Do not claim it.

---

# LINK RULES

Only use links confirmed within the supplied knowledge base.

Do not generate links.

Do not assume URLs.

Do not fabricate destinations.

---

# CONTENT QUALITY RULES

Every post should be:

- Publishable
- Readable
- Platform-specific
- Human sounding
- Consistent with STRAYD branding

Avoid:

- Repetition
- Generic AI language
- Empty motivational content
- Unsupported claims

---

# RETRY POLICY

If content generation fails:

Retry using exponential backoff.

Recommended delays:

```text
5
10
20
40
60
60
```

Retry on:

```text
408
409
425
429
500
502
503
504
```

Preserve previous generated content.

Never overwrite successful output.

---

# VALIDATION RULES

Before saving content:

Verify:

- Seven days exist.
- Days are in order.
- All platform sections exist.
- Content length is meaningful.
- Output is valid Markdown.

Reject output that fails validation.

---

# SAVE RULES

Generate:

```text
social-posts/
```

Structure:

```text
social-posts/

weekly/

daily/
```

Never overwrite existing files.

Use safe-write logic.

Preserve historical output.

---

# SUCCESS CRITERIA

The Social Agent is successful when:

- Seven complete days are generated.
- Every platform is included.
- Content matches STRAYD branding.
- Martin information is accurate.
- Suzuki information is accurate.
- Song information is accurate.
- Content is ready to publish.
- No facts are invented.

---

# MASTER PRINCIPLE

The purpose of the Social Agent is not simply to generate posts.

The purpose is to help real people discover:

