name: DAILY WEEKLY Social Export

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "social-posts/daily/**"
      - "social-posts/weekly/**"
      - ".github/workflows/export-social-posts.yml"
      - "scripts/build-social-posts-exports.py"

permissions:
  contents: write

jobs:
  export:
    name: Build Downloads
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Cache ONLY TeX Live (avoids permission denied errors on apt cache)
      - name: Cache LaTeX and Pandoc dependencies
        id: cache-latex
        uses: actions/cache@v4
        with:
          path: |
            /usr/share/texlive
          key: ${{ runner.os }}-texlive-${{ hashFiles('scripts/build-social-posts-exports.py') }}
          restore-keys: |
            ${{ runner.os }}-texlive-

      # 2. Install PDF tools only if cache misses
      - name: Install PDF tools
        if: steps.cache-latex.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic fonts-dejavu-core

      - name: Build DAILY and WEEKLY exports
        run: python scripts/build-social-posts-exports.py

      - name: Commit and push exports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update social post exports [skip ci]" && git pull --rebase origin main && git push)

      - name: Upload downloadable files
        uses: actions/upload-artifact@v4
        with:
          name: social-posts-exports
          path: exports/*
          if-no-files-found: error
          retention-days: 30
