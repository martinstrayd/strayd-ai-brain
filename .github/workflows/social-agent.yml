name: STRAYD Social Media Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-social-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-social-content:
    name: Generate and Validate STRAYD Social Content
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify knowledge files
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            brand-profile.md \
            martinstrayd.md \
            suzukimusic.md \
            songarchive.md \
            social-manager-prompt.md
          do
            if [ ! -s "$file" ]; then
              echo "::error::Required knowledge file missing or empty: $file"
              exit 1
            fi

            echo "Verified knowledge file: $file"
          done

          mkdir -p social-posts/weekly
          mkdir -p social-posts/daily

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google GenAI SDK
        run: pip install google-genai

      - name: Run Gemini Content Generator
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: python generate_content.py

      - name: Validate generated calendar
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(ls social-posts/weekly/*.md | head -1)

          for DAY in \
            Monday \
            Tuesday \
            Wednesday \
            Thursday \
            Friday \
            Saturday \
            Sunday
          do

            if ! grep -q "^## ${DAY}" "$FILE"; then
              echo "::error::Missing day heading: $DAY"
              exit 1
            fi

          done

          echo "Validation passed"

      - name: Commit generated content
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Generate STRAYD weekly social content via Gemini"

          git push
