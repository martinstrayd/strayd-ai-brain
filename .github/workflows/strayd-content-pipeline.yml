name: 🚀 STRAYD AI Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strayd Director Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          python strayd_director.py

      - name: Commit and Push Generated Content
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add social-posts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🚀 Auto-generate fresh weekly & daily STRAYD social content [skip ci]" && git push)
