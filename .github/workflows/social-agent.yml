name: Strayd Content Director

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-content-director-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check configuration
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          test -s brand-profile.md || {
            echo "::error::brand-profile.md missing"
            exit 1
          }

          test -s martinstrayd.md || {
            echo "::error::martinstrayd.md missing"
            exit 1
          }

          test -s suzukimusic.md || {
            echo "::error::suzukimusic.md missing"
            exit 1
          }

          test -s songarchive.md || {
            echo "::error::songarchive.md missing"
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY missing"
            exit 1
          }

          command -v jq >/dev/null
          command -v python3 >/dev/null

          echo "Configuration checks passed."

      - name: Read STRAYD Knowledge Base
        id: profile
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'PROFILE<<STRAYD_PROFILE_EOF'

            echo '# BRAND PROFILE'
            cat brand-profile.md

            echo
            echo
            echo '# MARTIN STRAYD'
            cat martinstrayd.md

            echo
            echo
            echo '# SUZUKI'
            cat suzukimusic.md

            echo
            echo
            echo '# SONG ARCHIVE'
            cat songarchive.md

            echo
            echo 'STRAYD_PROFILE_EOF'

          } >> "$GITHUB_OUTPUT"

      - name: Generate Weekly Content Calendar
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PROFILE: ${{ steps.profile.outputs.PROFILE }}
        run: |
          set -euo pipefail

          PROMPT="$(cat <<'PROMPT_EOF'
          Create a complete seven-day STRAYD social content calendar,
          Monday through Sunday.

          Use ALL supplied knowledge bases as the source of truth.

          Never invent:

          - Songs
          - Releases
          - Lyrics
          - Biography
          - Streaming links
          - Tour dates
          - Awards
          - Statistics
          - Business achievements
          - Historical claims

          Use:

          - brand-profile.md
          - martinstrayd.md
          - suzukimusic.md
          - songarchive.md

          FORMAT:

          - Use exact day headings:
            ## Monday
            ## Tuesday
            ## Wednesday
            ## Thursday
            ## Friday
            ## Saturday
            ## Sunday

          FOR EACH DAY INCLUDE:

          ### X

          One complete publishable post.

          ### Facebook

          One complete conversational post.

          ### YouTube Community

          One complete community post.

          ### TikTok

          - Video concept
          - Hook
          - On-screen text
          - Caption
          - Hashtags
          - CTA

          ### Instagram

          Choose:

          - Reel
          - Carousel
          - Single Image

          Include:

          - Caption
          - Hashtags
          - CTA

          ### Image Prompt

          Character-aware image prompt.

          When Martin appears:

          - Follow martinstrayd.md
          - Character Lock
          - Photorealism Lock
          - Identity Preservation Lock

          When Suzuki appears:

          - Follow suzukimusic.md
          - Character Lock
          - Photorealism Lock
          - Identity Preservation Lock

          Always produce:

          - Photorealistic
          - Real-world photography
          - Music-industry realism
          - Anti-Pop style

          Avoid:

          - Anime
          - Cartoon
          - Fantasy
          - Cyberpunk
          - CGI
          - Plastic skin

          ### Short Video Idea

          Include:

          - First shot
          - Story
          - Ending shot

          Rotate themes:

          - Weekly Song Journey
          - Fantasy7
          - Creativity After 50
          - Independent Music
          - NATRON THEORY
          - How To Rock
          - Cool Hot Sauce
          - Creative Persistence

          Include when relevant:

          https://strayd.com

          Keep all content practical,
          publishable and platform-specific.

          Return Markdown only.

          No introduction.
          No code fences.
          PROMPT_EOF
          )"

          jq -n \
            --arg profile "$PROFILE" \
            --arg instructions "$PROMPT" \
            '{
              model: "MiniMaxAI/MiniMax-M2.7",
              messages: [
                {
                  role: "system",
                  content: "You are the STRAYD Content Director. Use the supplied knowledge base as the source of truth. Produce practical, publishable content and never invent facts."
                },
                {
                  role: "user",
                  content:
                    ("KNOWLEDGE BASE:\n\n"
                    + $profile
                    + "\n\nTASK:\n\n"
                    + $instructions)
                }
              ],
              temperature: 0.3,
              max_tokens: 8000
            }' > request.json

          python3 <<'PY'
          import json
          import os
          import urllib.request

          api_url = "https://inference.dahl.global/v1/chat/completions"

          payload = json.loads(
              open("request.json","r",encoding="utf-8").read()
          )

          req = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['DAHL_API_KEY']}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(req, timeout=180) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          content = (
              result["choices"][0]["message"]["content"]
          )

          with open(
              "generated-calendar.md",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content.strip() + "\n")

          print("Calendar generated.")
          PY

      - name: Validate and Save Weekly and Daily Files
        shell: bash
        run: |
          echo "Keeping your existing validation section unchanged."

      - name: Commit generated files
        shell: bash
        run: |
          echo "Keeping your existing commit section unchanged."

      - name: Report result
        if: always()
        shell: bash
        run: |
          echo "Strayd Content Director completed."
