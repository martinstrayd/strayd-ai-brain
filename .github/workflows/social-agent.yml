
name: Strayd Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-content-director-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check configuration
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          test -s brand-profile.md || {
            echo "ERROR: brand-profile.md is missing or empty."
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "ERROR: DAHL_API_KEY secret is missing."
            exit 1
          }

      - name: Generate calendar with Dahl and MiniMax
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          jq -n --rawfile profile brand-profile.md '
            {
              model: "MiniMaxAI/MiniMax-M2.7",
              messages: [
                {
                  role: "system",
                  content: "You are the STRAYD Content Director. Use only facts supported by the supplied brand profile. Never invent songs, releases, dates, history, achievements, products or URLs. Create practical, publishable social content. Return valid JSON only."
                },
                {
                  role: "user",
                  content: (
                    "BRAND PROFILE:\n\n" + $profile +
                    "\n\nCreate a complete seven-day calendar, Monday through Sunday." +
                    "\nReturn one JSON object with a days array containing exactly seven objects." +
                    "\nEach object must have these six string fields: day, x_post, facebook_post, youtube_community_post, image_prompt, short_video_idea." +
                    "\nUse the day names Monday, Tuesday, Wednesday, Thursday, Friday, Saturday and Sunday in that order." +
                    "\nCreate actual post drafts for X, Facebook and YouTube Community, plus one image prompt and one short-video idea per day." +
                    "\nRotate between Weekly Song Journey, Fantasy7, Creativity After 50, Independent Music, NATRON THEORY, How To Rock, Cool Hot Sauce and Creative Persistence where supported by the brand profile." +
                    "\nUse strayd.com when appropriate. Do not invent URLs or facts." +
                    "\nWrite with strong hooks, natural language and useful calls to action. Avoid generic filler." +
                    "\nReturn JSON only, with no Markdown fences."
                  )
                }
              ],
              temperature: 0.7
            }
          ' > request.json

          echo "Calling Dahl inference API..."

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 \
            https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer ${DAHL_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            -o response.json

          jq -er '.choices[0].message.content | strings' \
            response.json > generated-raw.txt

      - name: Validate AI response
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path("generated-raw.txt").read_text(encoding="utf-8").strip()

          raw = re.sub(
              r"^\s*```(?:json)?\s*", "", raw, flags=re.IGNORECASE
          )
          raw = re.sub(r"\s*```\s*$", "", raw)

          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              start = raw.find("{")
              end = raw.rfind("}")
              if start < 0 or end <= start:
                  raise SystemExit("ERROR: No JSON object in AI response.")
              try:
                  data = json.loads(raw[start:end + 1])
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"ERROR: Invalid AI JSON: {exc}")

          expected = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          fields = [
              "x_post",
              "facebook_post",
              "youtube_community_post",
              "image_prompt",
              "short_video_idea"
          ]

          if not isinstance(data, dict):
              raise SystemExit("ERROR: Response must be a JSON object.")

          days = data.get("days")
          if not isinstance(days, list) or len(days) != 7:
              raise SystemExit("ERROR: Expected exactly seven days.")

          for i, day in enumerate(days):
              if not isinstance(day, dict) or day.get("day") != expected[i]:
                  raise SystemExit(f"ERROR: Incorrect day at position {i + 1}.")

              for field in fields:
                  value = day.get(field)
                  if not isinstance(value, str) or not value.strip():
                      raise SystemExit(
                          f"ERROR: Missing {field} for {expected[i]}."
                      )

          Path("generated.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("SUCCESS: Seven days and all five content types validated.")
          PY

      - name: Create matching weekly and daily Markdown files
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          data = json.loads(
              Path("generated.json").read_text(encoding="utf-8")
          )

          today = date.today()
          monday = today - timedelta(days=today.weekday())

          run_id = os.environ["RUN_ID"]
          attempt = os.environ["RUN_ATTEMPT"]

          root = Path("social-posts")
          weekly_dir = root / "weekly"
          daily_dir = root / "daily"
          approved_dir = root / "approved"
          published_dir = root / "published"

          for folder in (
              weekly_dir, daily_dir, approved_dir, published_dir
          ):
              folder.mkdir(parents=True, exist_ok=True)

          fields = [
              ("X POST", "x_post"),
              ("FACEBOOK POST", "facebook_post"),
              ("YOUTUBE COMMUNITY POST", "youtube_community_post"),
              ("IMAGE PROMPT", "image_prompt"),
              ("SHORT VIDEO IDEA", "short_video_idea"),
          ]

          def render_post(day, post_date):
              lines = [
                  f"# {day['day']} — {post_date.strftime('%d %B %Y')}",
                  "",
                  "**STRAYD CONTENT DIRECTOR**",
                  "",
                  f"**Date:** {post_date.isoformat()}",
                  f"**Status:** DRAFT — NOT APPROVED FOR PUBLISHING",
                  f"**Run:** {run_id} · Attempt {attempt}",
                  "",
                  "---",
                  "",
              ]

              for title, key in fields:
                  lines.extend([
                      f"## {title}",
                      "",
                      day[key].strip(),
                      "",
                      "---",
                      "",
                  ])

              return "\n".join(lines).rstrip() + "\n"

          weekly_lines = [
              "# STRAYD — Weekly Content Calendar",
              "",
              f"**Week beginning:** {monday.strftime('%d %B %Y')}",
              f"**Generation run:** {run_id} · Attempt {attempt}",
              "**Status:** DRAFT — REVIEW BEFORE PUBLISHING",
              "",
              "This calendar contains seven daily drafts. Each daily file "
              "uses the same headings and section order.",
              "",
              "---",
              "",
          ]

          for index, day in enumerate(data["days"]):
              post_date = monday + timedelta(days=index)
              slug = day["day"].lower()

              daily_file = daily_dir / (
                  f"{post_date.isoformat()}-{slug}"
                  f"-run-{run_id}-attempt-{attempt}.md"
              )

              # Exclusive creation prevents overwriting previous drafts.
              with daily_file.open("x", encoding="utf-8") as handle:
                  handle.write(render_post(day, post_date))

              weekly_lines.extend([
                  f"# {day['day']} — {post_date.strftime('%d %B %Y')}",
                  "",
              ])

              for title, key in fields:
                  weekly_lines.extend([
                      f"## {title}",
                      "",
                      day[key].strip(),
                      "",
                      "---",
                      "",
                  ])

              print(f"Created {daily_file}")

          weekly_file = weekly_dir / (
              f"{monday.isoformat()}-calendar"
              f"-run-{run_id}-attempt-{attempt}.md"
          )

          with weekly_file.open("x", encoding="utf-8") as handle:
              handle.write("\n".join(weekly_lines).rstrip() + "\n")

          print(f"Created {weekly_file}")

          (root / "README.md").write_text(
              "# STRAYD Social Content Library\n\n"
              "## Folders\n\n"
              "- `weekly/` — complete weekly Markdown calendars.\n"
              "- `daily/` — individual daily Markdown files.\n"
              "- `approved/` — reserved for explicitly approved posts.\n"
              "- `published/` — reserved for confirmed publishing records.\n\n"
              "Weekly and daily files use matching headings and section order. "
              "Every generation run has unique filenames to preserve earlier "
              "drafts.\n\n"
              "**Important:** Generation does not approve or publish posts.\n",
              encoding="utf-8"
          )

          (approved_dir / "README.md").write_text(
              "# Approved Posts\n\nReserved for explicitly approved content.\n",
              encoding="utf-8"
          )

          (published_dir / "README.md").write_text(
              "# Published Records\n\nReserved for confirmed publishing records.\n",
              encoding="utf-8"
          )
          PY

      - name: Commit generated files
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD social content run ${GITHUB_RUN_ID}"
          git push origin "HEAD:${TARGET_BRANCH}"

          echo "SUCCESS: Generated content committed to ${TARGET_BRANCH}."
