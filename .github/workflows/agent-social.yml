name: Strayd Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          test -s brand-profile.md || exit 1
          test -n "$DAHL_API_KEY" || exit 1
          echo "Config OK"

      - name: Generate content
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          jq -n --rawfile profile brand-profile.md '{
            model: "MiniMaxAI/MiniMax-M2.7",
            messages: [
              {role: "system", content: "You are the STRAYD Content Director. Focus on Martin Strayd and STRAYD band. Never invent facts. Return valid JSON."},
              {role: "user", content: ("BRAND PROFILE:\n\n" + $profile + "\n\nSTRAYD = Martin Strayd + Suzuki. 55 songs, new single weekly. World Tour 2027.\n\nCreate 7-day calendar. JSON with days array, 7 objects. Fields: day, x_post, facebook_post, instagram_post, tiktok_post, youtube_community_post, image_prompt, short_video_idea.\nDays: Monday to Sunday.\nX: 280 chars. FB: paragraphs. IG: 150-300 chars + hashtags. TikTok: hook + script.\nThemes: Weekly Song Journey, Creativity After 50, Independent Music, How To Rock, Creative Persistence, STRAYD Updates.\nReturn JSON only.")}
            ],
            temperature: 0.7
          }' > req.json

          for i in 1 2 3 4; do
            curl -s --fail-with-body --max-time 180 \
              https://inference.dahl.global/v1/chat/completions \
              -H "Authorization: Bearer $DAHL_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @req.json -o resp.json && break
            [ $i -lt 4 ] && sleep $((i * 5))
          done

          jq -r '.choices[0].message.content' resp.json > raw.txt

      - name: Parse and create files
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
import json, os, re, subprocess, time
from pathlib import Path
from datetime import date, timedelta

key = os.environ.get("DAHL_API_KEY", "")
run_id = os.environ.get("RUN_ID", "local")
DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]
FIELDS = ["x_post","facebook_post","instagram_post","tiktok_post","youtube_community_post","image_prompt","short_video_idea"]

def parse(text):
    text = re.sub(r"^```json\s*", "", text.strip(), flags=re.I)
    text = re.sub(r"```\s*$", "", text)
    try: return json.loads(text)
    except:
        s, e = text.find("{"), text.rfind("}")
        if s >= 0 and e > s: return json.loads(text[s:e+1])
        raise

def valid(data):
    if "days" not in data or len(data["days"]) != 7: raise ValueError("bad days")
    for i, d in enumerate(data["days"]):
        if d.get("day") != DAYS[i]: raise ValueError(f"wrong day {i}")
        for f in FIELDS:
            if not isinstance(d.get(f), str) or not d[f].strip(): raise ValueError(f"missing {f}")
    return data

raw = Path("raw.txt").read_text().strip()
data = None
try:
    data = valid(parse(raw))
except Exception as e:
    print(f"Repair: {e}")
    req = {"model":"MiniMaxAI/MiniMax-M2.7","temperature":0,"messages":[{"role":"system","content":"Return valid JSON. 7 days, fields: day,x_post,facebook_post,instagram_post,tiktok_post,youtube_community_post,image_prompt,short_video_idea."},{"role":"user","content":"Fix JSON:\n"+raw}]}
    Path("repair.json").write_text(json.dumps(req))
    for attempt in range(1,4):
        r = subprocess.run(["curl","-s","--fail-with-body","--max-time","180","https://inference.dahl.global/v1/chat/completions","-H","Authorization: Bearer "+key,"-H","Content-Type: application/json","--data-binary","@repair.json"],capture_output=True,text=True)
        if r.returncode == 0:
            try:
                data = valid(parse(json.loads(r.stdout)["choices"][0]["message"]["content"]))
                break
            except: pass
        if attempt < 3: time.sleep(attempt * 4)
    if not data: exit(1)

Path("generated.json").write_text(json.dumps(data, indent=2))

today = date.today()
monday = today - timedelta(days=today.weekday())
root = Path("social-posts")
for d in ("weekly","daily","approved","published"): (root/d).mkdir(parents=True, exist_ok=True)

for i, day in enumerate(data["days"]):
    pd = monday + timedelta(days=i)
    slug = day["day"].lower()
    lines = [f"# {day['day']} — {pd.strftime('%d %B %Y')}","","**STRAYD CONTENT DIRECTOR**","",f"**Date:** {pd.isoformat()}",f"**Run:** {run_id}","**Status:** DRAFT","","---",""]
    for f in FIELDS:
        lines += [f"## {f.replace('_',' ').title()}","",day[f].strip(),"","---",""]
    (root/"daily"/f"{pd.isoformat()}-{slug}.md").write_text("\n".join(lines))
    print(f"Created daily/{pd.isoformat()}-{slug}.md")

weekly = ["# STRAYD Weekly Calendar","",f"**Week of:** {monday.strftime('%d %B %Y')}","**Status:** DRAFT","","---",""]
for i, day in enumerate(data["days"]):
    pd = monday + timedelta(days=i)
    weekly += [f"## {day['day']} — {pd.strftime('%d %B %Y')}","","---",""]
    for f in FIELDS:
        weekly += [f"### {f.replace('_',' ').title()}","",day[f].strip(),"","---",""]
(root/"weekly"/f"{monday.isoformat()}-calendar.md").write_text("\n".join(weekly))
print("Created weekly calendar")

(root/"README.md").write_text("# STRAYD Content Library\n\nMartin Strayd + STRAYD band. 55 songs, new single weekly. World Tour 2027.\n\nFolders: daily/ weekly/ approved/ published/\n")
print("Done")
PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-posts/
          git diff --cached --quiet && exit 0
          git commit -m "STRAYD content $(date +%Y-%m-%d)"
          git push
