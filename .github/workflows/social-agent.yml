name: Strayd Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-content-director-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail
          test -s brand-profile.md || { echo "::error::brand-profile.md missing"; exit 1; }
          test -n "${DAHL_API_KEY:-}" || { echo "::error::DAHL_API_KEY missing"; exit 1; }
          echo "Configuration checks passed."

      - name: Read Brand Profile
        id: profile
        run: |
          {
            echo 'PROFILE<<EOF'
            cat brand-profile.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Generate Weekly Content Calendar
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PROFILE: ${{ steps.profile.outputs.PROFILE }}
        run: |
          set -euo pipefail

          curl -s --fail-with-body https://inference.dahl.global/v1/chat/completions \
          -H "Authorization: Bearer $DAHL_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$(jq -n \
            --arg p "$PROFILE" \
            '{
              model: "MiniMaxAI/MiniMax-M2.7",
              messages: [
                {
                  role: "system",
                  content: "You are the STRAYD Content Director. Use only information from the Martin Strayd Brand Profile. Never invent songs. Never invent releases. Never invent history. Create practical publishable content."
                },
                {
                  role: "user",
                  content: (
                    "BRAND PROFILE:\n\n" +
                    $p +
                    "\n\nCreate a complete 7-day content calendar.\n\n" +
                    "Monday through Sunday.\n\n" +
                    "For each day provide:\n\n" +
                    "- One X post\n" +
                    "- One Facebook post\n" +
                    "- One YouTube Community post idea\n" +
                    "- One Image Prompt\n" +
                    "- One Short Video Idea\n\n" +
                    "Rotate between:\n" +
                    "- Weekly Song Journey\n" +
                    "- Fantasy7\n" +
                    "- Creativity After 50\n" +
                    "- Independent Music\n" +
                    "- NATRON THEORY\n" +
                    "- How To Rock\n" +
                    "- Cool Hot Sauce\n" +
                    "- Creative Persistence\n\n" +
                    "Send people to strayd.com when appropriate.\n\n" +
                    "Return markdown only."
                  )
                }
              ]
            }')" > response.json

          # Extract content safely
          jq -er '.choices[0].message.content | strings' response.json > generated-calendar.md
          echo "Markdown calendar generated successfully."

      - name: Save and Organize Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p social-posts/weekly social-posts/daily

          # Copy generated markdown to weekly folder with date stamp
          WEEK_DATE=$(date +%Y-%m-%d)
          cp generated-calendar.md "social-posts/weekly/${WEEK_DATE}-calendar.md"

          # Create root README if missing
          if [ ! -f social-posts/README.md ]; then
            echo "# STRAYD Social Content Library" > social-posts/README.md
          fi

          echo "Files organized."

      - name: Commit generated files
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${TARGET_BRANCH}" || true
          git add social-posts/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD weekly markdown calendar ${GITHUB_RUN_ID}"
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "SUCCESS: Committed calendar to ${TARGET_BRANCH}."
