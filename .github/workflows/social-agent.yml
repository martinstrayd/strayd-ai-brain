name: Strayd Social Agent

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Folder
        run: mkdir -p reports

      - name: Generate Daily Report
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          curl -s https://inference.dahl.global/v1/chat/completions \
          -H "Authorization: Bearer $DAHL_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "model":"MiniMaxAI/MiniMax-M2.7",
            "messages":[
              {
                "role":"user",
                "content":"You are STRAYD SOCIAL MANAGER. Create:\n\n10 X posts\n\n3 Facebook posts\n\n1 YouTube Community post\n\n5 AI image prompts.\n\nReturn clean markdown only."
              }
            ]
          }' > reports/latest.json

      - name: Save Run Info
        run: |
          echo "# Strayd Social Agent Report" > reports/README.md
          echo "" >> reports/README.md
          echo "Generated: $(date)" >> reports/README.md
          echo "" >> reports/README.md
          echo "Open latest.json to view the full AI response." >> reports/README.md

      - name: Commit Report
        run: |
          git config --global user.name "Strayd Social Agent"
          git config --global user.email "actions@github.com"

          git add reports/

          git status

          git commit -m "Agent report update" || echo "Nothing to commit"

          git push
