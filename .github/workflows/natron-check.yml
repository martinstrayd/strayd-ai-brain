name: Check Natron Mentions

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the log file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python check_mentions.py
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - name: Commit log files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "natron log $(date +%Y-%m-%d)"
          git push
