name: Strayd Content Director

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  content-director:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          set -euo pipefail
          test -s brand-profile.md || { echo "::error::brand-profile.md missing"; exit 1; }
          echo "Config OK"

      - name: Read Brand Profile
        id: profile
        run: |
          {
            echo 'PROFILE<<EOF'
            cat brand-profile.md
            echo EOF
          } >> $GITHUB_OUTPUT

      - name: Generate Content
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PROFILE: ${{ steps.profile.outputs.PROFILE }}
        run: |
          set -euo pipefail

          curl -s https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer $DAHL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg p "$PROFILE" \
              '{
                model:"MiniMaxAI/MiniMax-M2.7",
                messages:[
                  {
                    role:"system",
                    content:"You are the STRAYD Content Director. Use only information from the Martin Strayd Brand Profile. Never invent songs. Never invent releases. Never invent history. Create practical publishable content."
                  },
                  {
                    role:"user",
                    content:(
                      "BRAND PROFILE:\n\n" +
                      $p +
                      "\n\nSTRAYD = Martin Strayd + Suzuki united. 55 songs total, one new single drops EVERY 7 DAYS. World Tour 2027 coming soon.\n\n" +
                      "Create a complete 7-day content calendar.\n\n" +
                      "Monday through Sunday.\n\n" +
                      "For each day provide:\n" +
                      "- Day name\n" +
                      "- One X post (280 chars max, hook/question)\n" +
                      "- One Facebook post (engaging paragraphs)\n" +
                      "- One Instagram post (150-300 chars + hashtags)\n" +
                      "- One TikTok post (hook + 15-60 sec script)\n" +
                      "- One YouTube Community post idea\n" +
                      "- One Image Prompt\n" +
                      "- One Short Video Idea\n\n" +
                      "Rotate between:\n" +
                      "- Weekly Song Journey\n" +
                      "- Creativity After 50\n" +
                      "- Independent Music\n" +
                      "- NATRON THEORY\n" +
                      "- How To Rock\n" +
                      "- Creative Persistence\n\n" +
                      "Send people to strayd.com when appropriate.\n\n" +
                      "Return markdown only."
                    )
                  }
                ]
              }')" > generated.md

          test -s generated.md || { echo "::error::Generation failed"; exit 1; }
          echo "Content generated"

      - name: Create files
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          python3 << 'PY'
import re
from datetime import date, timedelta
from pathlib import Path

content = Path("generated.md").read_text(encoding="utf-8")

today = date.today()
monday = today - timedelta(days=today.weekday())
run_id = "$RUN_ID"
attempt = "$RUN_ATTEMPT"

root = Path("social-posts")
(root/"weekly").mkdir(parents=True, exist_ok=True)
(root/"daily").mkdir(parents=True, exist_ok=True)
(root/"approved").mkdir(parents=True, exist_ok=True)
(root/"published").mkdir(parents=True, exist_ok=True)

DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"]

day_pattern = re.compile(r'^#?\s*(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*[-–]?\s*(\d{1,2}\s+\w+\s+\d{4})?', re.IGNORECASE)

current_day = None
current_data = {}

for line in content.split("\n"):
    line = line.strip()
    if not line:
        continue
    m = day_pattern.match(line)
    if m:
        if current_day and current_data:
            pd = monday + timedelta(days=DAYS.index(current_day))
            slug = current_day.lower()
            daily_file = root/"daily"/f"{pd.isoformat()}-{slug}.md"
            lines = [
                f"# {current_day} — {pd.strftime('%d %B %Y')}",
                "",
                "**STRAYD CONTENT DIRECTOR**",
                "",
                f"**Date:** {pd.isoformat()}",
                "**Status:** DRAFT — NOT APPROVED",
                f"**Run:** {run_id}",
                "",
                "---",
                ""
            ]
            for key in ["X POST","FACEBOOK POST","INSTAGRAM POST","TIKTOK POST","YOUTUBE COMMUNITY POST","IMAGE PROMPT","SHORT VIDEO IDEA"]:
                lines += [f"## {key}","",current_data.get(key,""),"","---",""]
            daily_file.write_text("\n".join(lines))
            print(f"Created {daily_file}")
        current_day = m.group(1).title()
        current_data = {}
    else:
        for prefix in ["X POST","FACEBOOK POST","INSTAGRAM POST","TIKTOK POST","YOUTUBE COMMUNITY POST","IMAGE PROMPT","SHORT VIDEO IDEA"]:
            if line.upper().startswith(prefix):
                current_data[prefix] = line[len(prefix):].strip().lstrip(":-").strip()
                break

if current_day and current_data:
    pd = monday + timedelta(days=DAYS.index(current_day))
    slug = current_day.lower()
    daily_file = root/"daily"/f"{pd.isoformat()}-{slug}.md"
    lines = [
        f"# {current_day} — {pd.strftime('%d %B %Y')}",
        "",
        "**STRAYD CONTENT DIRECTOR**",
        "",
        f"**Date:** {pd.isoformat()}",
        "**Status:** DRAFT — NOT APPROVED",
        f"**Run:** {run_id}",
        "",
        "---",
        ""
    ]
    for key in ["X POST","FACEBOOK POST","INSTAGRAM POST","TIKTOK POST","YOUTUBE COMMUNITY POST","IMAGE PROMPT","SHORT VIDEO IDEA"]:
        lines += [f"## {key}","",current_data.get(key,""),"","---",""]
    daily_file.write_text("\n".join(lines))
    print(f"Created {daily_file}")

weekly_file = root/"weekly"/f"{monday.isoformat()}-calendar.md"
weekly_lines = [
    "# STRAYD — Weekly Content Calendar",
    "",
    f"**Week beginning:** {monday.strftime('%d %B %Y')}",
    f"**Run:** {run_id}",
    "**Status:** DRAFT — REVIEW BEFORE PUBLISHING",
    "",
    "---",
    "",
    content
]
weekly_file.write_text("\n".join(weekly_lines))
print(f"Created {weekly_file}")

(root/"README.md").write_text("# STRAYD Content Library\n\nMartin Strayd + STRAYD band. 55 songs, new single weekly. World Tour 2027.\n\nFolders: daily/ weekly/ approved/ published/\n")
(root/"approved"/"README.md").write_text("# Approved Content\n\nMove content here after review.\n")
(root/"published"/"README.md").write_text("# Published Content\n\nConfirmed posts.\n")
print("Done")
PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-posts/
          git diff --cached --quiet && exit 0
          git commit -m "STRAYD content $(date +%Y-%m-%d)"
          git push
