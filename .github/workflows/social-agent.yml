name: Strayd Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-content-director-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          test -s brand-profile.md || {
            echo "::error::brand-profile.md missing"
            exit 1
          }

          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY missing"
            exit 1
          }

          command -v jq >/dev/null
          command -v python3 >/dev/null

          echo "Configuration checks passed."

      - name: Read Brand Profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'PROFILE<<STRAYD_PROFILE_EOF'
            cat brand-profile.md
            echo
            echo 'STRAYD_PROFILE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Weekly Content Calendar
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PROFILE: ${{ steps.profile.outputs.PROFILE }}
        run: |
          set -euo pipefail

          PROMPT="$(cat <<'PROMPT_EOF'
          Create a complete seven-day STRAYD social content calendar,
          Monday through Sunday.

          Use the supplied brand profile as the source of truth.
          Never invent songs, releases, lyrics, biography, achievements,
          release dates, streaming links or other facts.

          FORMAT:
          - Use one main heading for each day:
            ## Monday, ## Tuesday, ## Wednesday, ## Thursday,
            ## Friday, ## Saturday, ## Sunday.
          - Use readable Markdown headings, bold labels and bullet lists.
          - Include every platform listed below for every day.
          - Write complete, publishable content, not just advice.
          - Make each platform's content distinct.

          FOR EACH DAY INCLUDE:

          1. X
          - One concise, ready-to-publish post.

          2. Facebook
          - One complete, conversational post.

          3. YouTube Community
          - One complete post, question or poll idea with publishable text.

          4. TikTok
          - A practical video concept and visual action.
          - A strong opening hook for the first 1-3 seconds.
          - On-screen text in sequence.
          - A complete, ready-to-publish caption.
          - Relevant hashtags.
          - Suggested sound or music direction.
          - A clear call to action.
          - Keep the concept achievable with available footage,
            artwork or simple filming.

          5. Instagram
          - Choose Reel, carousel or single-image post.
          - Describe the visual concept.
          - Write the complete, ready-to-publish caption.
          - Include relevant hashtags.
          - For Reels, provide the opening hook and on-screen text.
          - For carousels, provide the text for each slide.
          - Include a clear call to action.

          6. Image Prompt
          - A detailed prompt suitable for creating the day's social artwork.

          7. Short Video Idea
          - A practical concept, first shot and ending.

          Rotate these themes across the week:
          - Weekly Song Journey
          - Fantasy7
          - Creativity After 50
          - Independent Music
          - NATRON THEORY
          - How To Rock
          - Cool Hot Sauce
          - Creative Persistence

          Use https://strayd.com when appropriate.
          Only use links confirmed in the brand profile.
          Do not invent facts to fill gaps.

          Keep the existing STRAYD voice and identity.
          Make the daily content easy to scan and ready to use.
          Do not repeat the same copy across different platforms.

          Return Markdown only, with no code fences or introduction.
          PROMPT_EOF
          )"

          jq -n \
            --arg profile "$PROFILE" \
            --arg instructions "$PROMPT" \
            '{
              model: "MiniMaxAI/MiniMax-M2.7",
              messages: [
                {
                  role: "system",
                  content: "You are the STRAYD Content Director. Follow the supplied brand profile. Produce accurate, practical and publishable social content. Never invent factual claims."
                },
                {
                  role: "user",
                  content: (
                    "BRAND PROFILE:\n\n" +
                    $profile +
                    "\n\nCONTENT REQUIREMENTS:\n\n" +
                    $instructions
                  )
                }
              ]
            }' > request.json

          echo "Sending content request to Dahl API..."

          curl --silent --show-error --fail-with-body \
            --max-time 240 \
            https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer ${DAHL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          jq -er '
            .choices[0].message.content
            | strings
            | select(length > 100)
          ' response.json > generated-calendar.md

          echo "Weekly calendar generated."

      - name: Save Weekly Calendar and README
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          source = Path("generated-calendar.md")
          content = source.read_text(encoding="utf-8").strip()

          if len(content) < 100:
              raise SystemExit("Generated calendar is empty or too short.")

          today = datetime.now(timezone.utc).date().isoformat()
          weekly_dir = Path("social-posts/weekly")
          weekly_dir.mkdir(parents=True, exist_ok=True)

          weekly_file = weekly_dir / f"{today}-calendar.md"
          weekly_file.write_text(content + "\n", encoding="utf-8")
          print(f"Created {weekly_file}")

          readme = Path("social-posts/README.md")

          if not readme.exists():
              readme.parent.mkdir(parents=True, exist_ok=True)
              readme.write_text(
                  "# STRAYD Social Posts\n\n"
                  "Weekly social content calendars generated by "
                  "the Strayd Content Director workflow.\n\n"
                  "Each calendar contains daily content for X, "
                  "Facebook, YouTube Community, TikTok and Instagram, "
                  "along with image prompts and short video ideas.\n\n"
                  "## Weekly Calendars\n\n"
                  "Open the `weekly/` folder to find the generated "
                  "Markdown calendars.\n",
                  encoding="utf-8"
              )
              print("Created social-posts/README.md")
          PY

      - name: Commit generated files
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/

          if git diff --cached --quiet; then
            echo "No new changes to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD weekly social content"

          git push origin "HEAD:${TARGET_BRANCH}"

          echo "Weekly STRAYD social calendar committed successfully."
