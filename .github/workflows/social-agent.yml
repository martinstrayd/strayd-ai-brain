
name: Strayd Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

concurrency:
  group: strayd-content-director-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-director:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail
          test -s brand-profile.md || {
            echo "::error::brand-profile.md missing"
            exit 1
          }
          test -n "${DAHL_API_KEY:-}" || {
            echo "::error::DAHL_API_KEY missing"
            exit 1
          }
          command -v jq >/dev/null
          command -v python3 >/dev/null
          echo "Configuration checks passed."

      - name: Read Brand Profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'PROFILE<<STRAYD_PROFILE_EOF'
            cat brand-profile.md
            echo
            echo 'STRAYD_PROFILE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate Weekly Content Calendar
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
          PROFILE: ${{ steps.profile.outputs.PROFILE }}
        run: |
          set -euo pipefail

          PROMPT="$(cat <<'PROMPT_EOF'
          Create a complete seven-day STRAYD social content calendar,
          Monday through Sunday.

          Use the supplied brand profile as the source of truth.
          Never invent songs, releases, lyrics, biography, achievements,
          release dates, streaming links or other facts.

          FORMAT:
          - Use exactly one main heading for each day:
            ## Monday, ## Tuesday, ## Wednesday, ## Thursday,
            ## Friday, ## Saturday, ## Sunday.
          - Use clear Markdown headings, bold labels and bullet lists.
          - Include every platform listed below for every day.
          - Write complete, publishable content, not just advice.
          - Keep the daily and weekly content readable and consistent.
          - Make each platform's content distinct.

          FOR EACH DAY INCLUDE:

          1. X
          - One concise, ready-to-publish post.

          2. Facebook
          - One complete, conversational post.

          3. YouTube Community
          - One complete post, question or poll idea with publishable text.

          4. TikTok
          - Video concept and visual action.
          - Opening hook for the first 1-3 seconds.
          - On-screen text in sequence.
          - Complete caption.
          - Relevant hashtags.
          - Suggested sound or music direction.
          - Call to action.

          5. Instagram
          - Choose Reel, carousel or single-image post.
          - Describe the visual concept.
          - Write the complete caption.
          - Include relevant hashtags.
          - For Reels, provide the opening hook and on-screen text.
          - For carousels, provide text for each slide.
          - Include a call to action.

          6. Image Prompt
          - A detailed prompt for the day's social artwork.

          7. Short Video Idea
          - A practical concept, first shot and ending.

          Rotate these themes across the week:
          - Weekly Song Journey
          - Fantasy7
          - Creativity After 50
          - Independent Music
          - NATRON THEORY
          - How To Rock
          - Cool Hot Sauce
          - Creative Persistence

          Use https://strayd.com when appropriate.
          Only use links confirmed in the brand profile.
          Do not invent facts to fill gaps.

          Return Markdown only, with no code fences or introduction.
          PROMPT_EOF
          )"

          jq -n \
            --arg profile "$PROFILE" \
            --arg instructions "$PROMPT" \
            '{
              model: "MiniMaxAI/MiniMax-M2.7",
              messages: [
                {
                  role: "system",
                  content: "You are the STRAYD Content Director. Follow the supplied brand profile. Produce accurate, practical and publishable social content. Never invent factual claims."
                },
                {
                  role: "user",
                  content: (
                    "BRAND PROFILE:\n\n" +
                    $profile +
                    "\n\nCONTENT REQUIREMENTS:\n\n" +
                    $instructions
                  )
                }
              ]
            }' > request.json

          echo "Sending content request to Dahl API..."

          curl --silent --show-error --fail-with-body \
            --max-time 240 \
            https://inference.dahl.global/v1/chat/completions \
            -H "Authorization: Bearer ${DAHL_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          jq -er '
            .choices[0].message.content
            | strings
            | select(length > 100)
          ' response.json > generated-calendar.md

          for platform in TikTok Instagram Facebook YouTube X; do
            if ! grep -qi "$platform" generated-calendar.md; then
              echo "::error::Generated calendar is missing $platform content."
              exit 1
            fi
          done

          echo "Calendar generated with all five social platforms."

      - name: Create Weekly and Daily Markdown Files
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import re
          import sys

          source = Path("generated-calendar.md")
          text = source.read_text(encoding="utf-8").strip()

          weekly_dir = Path("social-posts/weekly")
          daily_dir = Path("social-posts/daily")

          weekly_dir.mkdir(parents=True, exist_ok=True)
          daily_dir.mkdir(parents=True, exist_ok=True)

          today = datetime.now(timezone.utc).date().isoformat()

          # Save the complete weekly calendar.
          weekly_file = weekly_dir / f"{today}-calendar.md"
          weekly_file.write_text(text + "\n", encoding="utf-8")

          days = [
              "Monday", "Tuesday", "Wednesday", "Thursday",
              "Friday", "Saturday", "Sunday"
          ]

          pattern = re.compile(
              r"^##\s+(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*$",
              re.MULTILINE | re.IGNORECASE
          )

          matches = list(pattern.finditer(text))
          found = [m.group(1).capitalize() for m in matches]

          missing = [day for day in days if day not in found]
          if missing:
              print(
                  "ERROR: Missing day headings: " + ", ".join(missing),
                  file=sys.stderr
              )
              sys.exit(1)

          for index, match in enumerate(matches):
              day = match.group(1).capitalize()
              start = match.start()
              end = (
                  matches[index + 1].start()
                  if index + 1 < len(matches)
                  else len(text)
              )

              section = text[start:end].strip()

              # Check that every day has the required platforms.
              for platform in (
                  "TikTok", "Instagram", "Facebook", "YouTube", "X"
              ):
                  if not re.search(
                      re.escape(platform), section, re.IGNORECASE
                  ):
                      print(
                          f"ERROR: {day} is missing {platform}.",
                          file=sys.stderr
                      )
                      sys.exit(1)

              output = daily_dir / f"{today}-{day.lower()}.md"
              content = (
                  f"# STRAYD Daily Social Content — {day}\n\n"
                  f"Generated: {today}\n\n"
                  f"{section}\n"
              )
              output.write_text(content, encoding="utf-8")
              print(f"Created {output}")

          print(f"Created {weekly_file}")
          PY

      - name: Commit generated files
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add social-posts/weekly/ social-posts/daily/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          git commit -m "Generate STRAYD social content with TikTok and Instagram"
          git push origin "HEAD:${TARGET_BRANCH}"

          echo "SUCCESS: Weekly and daily content committed."
