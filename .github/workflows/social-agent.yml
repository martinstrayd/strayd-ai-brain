# DAILY OUTPUT STRUCTURE

Every day must contain:

```text
### X

### Facebook

### YouTube Community

### TikTok

### Instagram

### Image Prompt

### Short Video Idea
```

No sections may be omitted.

---

# WEEKLY OUTPUT STRUCTURE

Every weekly calendar must contain:

```text
## Monday

## Tuesday

## Wednesday

## Thursday

## Friday

## Saturday

## Sunday
```

Days must appear in order.

No day may be omitted.

