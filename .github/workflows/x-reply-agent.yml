name: STRAYD X Reply Agent

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode (no actual replies)"
        required: false
        default: "true"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

env:
  DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
  DAHL_API_URL: https://inference.dahl.global/v1/chat/completions
  DAHL_MODEL: MiniMaxAI/MiniMax-M2.7
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
  TEST_MODE: ${{ github.event.inputs.test_mode || 'true' }}

jobs:
  monitor-and-reply:
    name: STRAYD X Reply Agent
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run X Reply Agent
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import datetime
          import json
          import os
          import sys
          import urllib.request
          import urllib.parse
          import time
          import random
          import string

          API_KEY = os.environ["X_API_KEY"]
          API_SECRET = os.environ["X_API_SECRET"]
          ACCESS_TOKEN = os.environ["X_ACCESS_TOKEN"]
          ACCESS_SECRET = os.environ["X_ACCESS_SECRET"]
          BEARER_TOKEN = os.environ["X_BEARER_TOKEN"]

          DAHL_API_URL = os.environ["DAHL_API_URL"]
          DAHL_API_KEY = os.environ["DAHL_API_KEY"]
          DAHL_MODEL = os.environ["DAHL_MODEL"]

          TEST_MODE = os.environ.get("TEST_MODE", "true").lower() == "true"

          print("=== STRAYD X REPLY AGENT ===")
          print(f"Time: {datetime.datetime.now(datetime.timezone.utc)}")
          print(f"Test Mode: {TEST_MODE}")
          print()

          def x_api_get(endpoint, params=None):
              url = f"https://api.twitter.com{endpoint}"
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(url)
              request.add_header("Authorization", f"Bearer {BEARER_TOKEN}")
              request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except Exception as e:
                  print(f"X API Error: {e}")
                  return None

          def x_api_post(endpoint, data):
              url = f"https://api.twitter.com{endpoint}"
              request_data = json.dumps(data).encode("utf-8")
              request = urllib.request.Request(
                  url, data=request_data,
                  headers={"Authorization": f"Bearer {BEARER_TOKEN}", "Content-Type": "application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except Exception as e:
                  print(f"X POST Error: {e}")
                  return None

          print("Fetching X user info...")
          me = x_api_get("/2/users/me")
          if not me or "data" not in me:
              print("Failed to get user info. Check API credentials.")
              sys.exit(1)

          my_id = me["data"]["id"]
          my_username = me["data"]["username"]
          print(f"Logged in as: @{my_username}")
          print()

          print("Fetching recent mentions...")
          mentions = x_api_get(
              f"/2/users/{my_id}/mentions",
              {
                  "max_results": 10,
                  "tweet.fields": "created_at,author_id",
                  "expansions": "author_id",
                  "user.fields": "username,name"
              }
          )

          if not mentions or "data" not in mentions:
              print("No mentions found.")
              sys.exit(0)

          tweets = mentions.get("data", [])
          users = {u["id"]: u for u in mentions.get("includes", {}).get("users", [])}

          if not tweets:
              print("No new mentions.")
              sys.exit(0)

          print(f"Found {len(tweets)} mentions")
          print()

          def generate_reply(tweet_text, author_username):
              prompt = f"""You are Natron Theory's AI assistant. Natron Theory is artificial stone technology by Martin Strayd + a few friends like Marcell Foti and MondoStone - a rock lover building a megalithic retreat, making prototype geopolymer with abundant materials.

Generate a reply to this tweet directed at Natron Theory's X account:

Tweet from @{author_username}:
"{tweet_text}"

Rules:
- Reply as Natron Theory CEO, personally
- Keep it under 200 characters
- Be engaging, not spammy
- Include a relevant hashtag only if natural
- If the tweet is unrelated to geopolymer, natron theory or martin strayd, keep reply brief and friendly
- Never be aggressive or defensive
- Sound like a real person, not AI

Return ONLY the reply text, nothing else.
"""
              try:
                  payload = {
                      "model": DAHL_MODEL,
                      "messages": [
                          {"role": "system", "content": "You are Natron Theory's AI assistant. Return only the reply text."},
                          {"role": "user", "content": prompt}
                      ],
                      "temperature": 0.7,
                      "max_tokens": 280,
                  }
                  request_data = json.dumps(payload).encode("utf-8")
                  request = urllib.request.Request(
                      DAHL_API_URL,
                      data=request_data,
                      headers={
                          "Authorization": f"Bearer {DAHL_API_KEY}",
                          "Content-Type": "application/json",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode("utf-8"))
                      return data["choices"][0]["message"]["content"].strip()
              except Exception as e:
                  print(f"DAHL Error: {e}")
                  return None

          print("=== PROCESSING MENTIONS ===")
          processed = 0
          replied = 0

          for tweet in tweets:
              tweet_id = tweet["id"]
              tweet_text = tweet["text"]
              author_id = tweet["author_id"]
              author = users.get(author_id, {})
              author_username = author.get("username", "unknown")

              print(f"\n--- @{author_username}: {tweet_text[:80]}...")

              reply_text = generate_reply(tweet_text, author_username)
              if not reply_text:
                  print("Skipping - could not generate reply")
                  continue

              print(f"Reply: {reply_text}")

              if TEST_MODE:
                  print("TEST MODE - Would have posted")
              else:
                  result = x_api_post("/2/tweets", {
                      "text": reply_text,
                      "reply": {"in_reply_to_tweet_id": tweet_id}
                  })
                  if result and "data" in result:
                      print(f"REPLIED: {result['data']['id']}")
                      replied += 1
                  else:
                      print(f"Failed: {result}")

              processed += 1
              time.sleep(2)

          print()
          print(f"Processed: {processed}, Replied: {replied}")

          log_entry = f"""# X Reply Agent Log

**Time:** {datetime.datetime.now(datetime.timezone.utc)}
**Test Mode:** {TEST_MODE}
**Processed:** {processed}
**Replied:** {replied}
"""
          os.makedirs("x-replies", exist_ok=True)
          log_file = f"x-replies/log-{datetime.datetime.now().strftime('%Y%m%d-%H%M%S')}.md"
          with open(log_file, "w") as f:
              f.write(log_entry)

          print(f"Log saved: {log_file}")
          PY

      - name: Commit log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-replies/
          git diff --cached --quiet || git commit -m "X reply agent run - $(date +%Y%m%d-%H%M%S)"
          git push 2>/dev/null || echo "Nothing to push"
