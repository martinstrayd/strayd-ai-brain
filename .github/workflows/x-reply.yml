name: X Reply Agent

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode"
        required: false
        default: "true"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

env:
  DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
  DAHL_API_URL: https://inference.dahl.global/v1/chat/completions
  DAHL_MODEL: MiniMaxAI/MiniMax-M2.7
  X_BEARER: ${{ secrets.X_BEARER_TOKEN }}
  TEST: ${{ github.event.inputs.test || 'true' }}

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run X Reply Agent
        run: python3 .github/workflows/x-reply.py

      - name: Save log
        run: |
          mkdir -p x-replies
          echo "# X Agent Log - $(date)" > x-replies/log-$(date +%Y%m%d-%H%M%S).md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add x-replies/ || true
          git diff --cached --quiet || git commit -m "X agent run" || true
          git push || true
