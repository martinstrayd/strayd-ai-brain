name: STRAYD Social Media Content Director

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

env:
  DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
  DAHL_API_URL: https://inference.dahl.global/v1/chat/completions
  DAHL_MODEL: MiniMaxAI/MiniMax-M2.7

jobs:
  generate-social-content:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create content
        shell: bash
        run: |

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import datetime
          from pathlib import Path

          api_key = os.environ["DAHL_API_KEY"]
          api_url = os.environ["DAHL_API_URL"]
          model = os.environ["DAHL_MODEL"]

          Path("social-posts/weekly").mkdir(
              parents=True,
              exist_ok=True
          )

          Path("social-posts/daily").mkdir(
              parents=True,
              exist_ok=True
          )

          week_start = (
              datetime.datetime.utcnow().date()
              - datetime.timedelta(
                  days=datetime.datetime.utcnow().weekday()
              )
          )

          prompt = """
Create a complete 7 day STRAYD social media calendar.

For every day Monday through Sunday include:

### X
### Facebook
### YouTube Community
### TikTok
### Instagram
### Image Prompt
### Short Video Idea

Return markdown only.
"""

          payload = {
              "model": model,
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "temperature": 0.7,
              "max_tokens": 8000
          }

          req = urllib.request.Request(
              api_url,
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(
              req,
              timeout=300
          ) as r:

              data = json.loads(
                  r.read().decode()
              )

          markdown = (
              data["choices"][0]
              ["message"]
              ["content"]
          )

          Path(
              "debug-response.md"
          ).write_text(
              markdown,
              encoding="utf-8"
          )

          weekly = (
              f"social-posts/weekly/"
              f"{week_start}-calendar.md"
          )

          Path(weekly).write_text(
              markdown,
              encoding="utf-8"
          )
          for day in [
              "monday",
              "tuesday",
              "wednesday",
              "thursday",
              "friday",
              "saturday",
              "sunday"
          ]:

              Path(
                  f"social-posts/daily/{day}.md"
              ).write_text(
                  markdown,
                  encoding="utf-8"
              )

          print("SUCCESS")
          PY

      - name: Upload debug response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dahl-debug-${{ github.run_number }}
          path: debug-response.md
          if-no-files-found: ignore

      - name: Commit content
        shell: bash
        run: |

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add social-posts/
          git add debug-response.md

          git diff --cached --quiet && exit 0

          git commit -m "Generate STRAYD content"

          git push
