- name: Generate weekly content with Dahl and MiniMax
        shell: bash
        env:
          DAHL_API_KEY: ${{ secrets.DAHL_API_KEY }}
        run: |
          set -euo pipefail

          PROFILE=$(cat brand-profile.md)
          jq -n --arg p "$PROFILE" '{
            model: "MiniMaxAI/MiniMax-M2.7",
            messages: [
              {role: "system", content: "You are the STRAYD Content Director. Focus on Martin Strayd and STRAYD band. Never invent facts. Return valid JSON."},
              {role: "user", content: "BRAND PROFILE:\n\n\($p)\n\nSTRAYD = Martin Strayd + Suzuki. 55 songs, new single weekly. World Tour 2027.\n\nCreate 7-day calendar. JSON with days array, 7 objects. Fields: day, x_post, facebook_post, instagram_post, tiktok_post, youtube_community_post, image_prompt, short_video_idea.\nDays: Monday to Sunday.\nX: 280 chars, hook/question. FB: paragraphs. IG: 150-300 chars + hashtags. TikTok: hook + script.\nThemes: Weekly Song Journey, Creativity After 50, Independent Music, NATRON THEORY, How To Rock, Creative Persistence, STRAYD Updates.\nReturn JSON only."}
            ],
            temperature: 0.7
          }' > request.json

          success=0
          for attempt in 1 2 3 4; do
            echo "Generation attempt ${attempt}/4..."
            if curl --fail-with-body --silent --show-error \
              --connect-timeout 20 --max-time 180 \
              https://inference.dahl.global/v1/chat/completions \
              -H "Authorization: Bearer ${DAHL_API_KEY}" \
              -H "Content-Type: application/json" \
              --data-binary @request.json -o response.json; then
              success=1
              break
            fi
            [ "$attempt" -lt 4 ] && sleep $((attempt * 5))
          done

          [ "$success" -ne 1 ] && { echo "::error::Generation failed"; exit 1; }
          jq -e 'type == "object"' response.json >/dev/null 2>&1 || { echo "::error::Invalid response"; exit 1; }
          jq -e '.error' response.json >/dev/null 2>&1 && { echo "::error::API error"; exit 1; }
          jq -er '.choices[0].message.content | strings' response.json > generated-raw.txt || { echo "::error::No content"; exit 1; }
          echo "AI response received."
