name: Strayd Social Agent

on:
  workflow_dispatch:

  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  create-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Content Folder
        run: mkdir -p content

      - name: Generate Social Content
        run: |
          curl -s https://inference.dahl.global/v1/chat/completions \
          -H "Authorization: Bearer ${{ secrets.DAHL_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "model":"MiniMaxAI/MiniMax-M2.7",
            "messages":[
              {
                "role":"user",
                "content":"You are STRAYD SOCIAL MANAGER. Create: 10 X posts, 3 Facebook posts, 1 YouTube Community post and 5 image prompts for an independent music artist."
              }
            ]
          }' > content/output.json

      - name: Add Date Stamp
        run: |
          DATE=$(date +%F)
          cp content/output.json content/${DATE}.json

      - name: Commit Content
        run: |
          git config user.name "Strayd Social Agent"
          git config user.email "actions@github.com"
          git add content/
          git commit -m "Daily social content $(date +%F)" || echo "No changes"
          git push
